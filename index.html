<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>归墟录 - Windows XP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:text;user-select:text}
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap');
html,body{width:100%;height:100%;overflow:hidden;font-family:'Tahoma','Microsoft YaHei','SimSun',sans-serif;font-size:12px}

/* ===== BOOT SCREEN ===== */
#boot-screen{position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.5s}
#boot-screen.fade{opacity:0;pointer-events:none}
.xp-logo{display:flex;flex-direction:column;align-items:center;opacity:0;animation:xpLogoIn 1s .5s forwards}
.xp-flag{width:80px;height:80px;margin-bottom:15px;position:relative}
.xp-flag div{position:absolute;border-radius:2px}
.xp-flag .f1{width:35px;height:35px;background:#f00;top:0;left:0;border-radius:0 4px 0 4px}
.xp-flag .f2{width:35px;height:35px;background:#0f0;top:0;right:0;border-radius:4px 0 4px 0}
.xp-flag .f3{width:35px;height:35px;background:#00f;bottom:0;left:0;border-radius:0 4px 0 4px}
.xp-flag .f4{width:35px;height:35px;background:#ff0;bottom:0;right:0;border-radius:4px 0 4px 0}
.xp-brand{color:#fff;font-size:28px;font-family:'Franklin Gothic Medium','Tahoma',sans-serif;letter-spacing:2px;font-style:italic}
.xp-brand span{color:#fff;font-weight:bold}
.xp-sub{color:#ccc;font-size:13px;margin-top:4px;font-style:italic}
.boot-progress{width:220px;height:14px;margin-top:40px;position:relative;opacity:0;animation:xpLogoIn 1s 1.5s forwards}
.boot-track{width:100%;height:100%;background:transparent;position:relative;overflow:hidden}
.boot-block{position:absolute;width:22px;height:100%;background:linear-gradient(90deg,#0054e3,#3c8bff,#0054e3);animation:bootSlide 2s linear infinite}
@keyframes bootSlide{0%{left:-30px}100%{left:230px}}
@keyframes xpLogoIn{to{opacity:1}}
#welcome-screen{position:fixed;inset:0;background:linear-gradient(180deg,#0054e3 0%,#0054e3 45%,#2b7de9 100%);z-index:99998;display:none;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1.5s}
#welcome-screen.fade{opacity:0;pointer-events:none}
.welcome-text{color:#fff;font-size:22px;font-family:'Franklin Gothic Medium','Tahoma',sans-serif;text-align:center;text-shadow:1px 1px 3px rgba(0,0,0,.3)}
.welcome-sub{color:rgba(255,255,255,.8);font-size:13px;margin-top:10px}

/* ===== BSOD ===== */
#bsod{position:fixed;inset:0;background:#0000aa;z-index:100000;display:none;padding:10%;font-family:'Lucida Console','Courier New',monospace;color:#fff;font-size:14px;line-height:2}
#bsod .bsod-title{background:#aaa;color:#0000aa;padding:2px 10px;display:inline-block;margin-bottom:20px}
#bsod.show{display:block}

#desktop.active{display:block}
.desktop-area{position:absolute;inset:0;bottom:36px;padding:10px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:5px}

/* Desktop Icons */
.desk-icon{width:75px;padding:4px;text-align:center;cursor:pointer;border:1px solid transparent;border-radius:2px;position:relative}
.desk-icon:hover{background:rgba(255,255,255,.1)}
.desk-icon.selected{background:rgba(49,106,213,.4);border-color:rgba(49,106,213,.6)}
.desk-icon .icon-img{width:32px;height:32px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1}
.desk-icon .icon-label{color:#fff;font-size:11px;text-shadow:1px 1px 2px rgba(0,0,0,.8);word-wrap:break-word;line-height:1.3}

/* ===== TASKBAR ===== */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:36px;background:linear-gradient(180deg,#3168d5 0%,#4993d6 3%,#245edc 6%,#245edc 50%,#1941a5 95%,#1941a5 100%);border-top:1px solid #0c3c8a;display:flex;align-items:center;z-index:9000}
#start-btn{height:30px;padding:0 12px 0 6px;background:linear-gradient(180deg,#3c8b3c 0%,#276b27 45%,#1e5a1e 50%,#3c8b3c 100%);border:1px solid #1e5a1e;border-radius:0 8px 8px 0;margin-left:0;display:flex;align-items:center;gap:4px;cursor:pointer;color:#fff;font-weight:bold;font-size:13px;font-style:italic;text-shadow:1px 1px 1px rgba(0,0,0,.3);border-right:none;position:relative}
#start-btn::before{content:'';position:absolute;top:0;right:0;width:40%;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent);border-radius:0 8px 0 0;pointer-events:none}
#start-btn .win-logo{width:20px;height:20px;display:grid;grid-template-columns:1fr 1fr;gap:1px}
#start-btn .win-logo div{border-radius:1px}
#start-btn .win-logo .w1{background:#ff0000}
#start-btn .win-logo .w2{background:#00aa00}
#start-btn .win-logo .w3{background:#0000ff}
#start-btn .win-logo .w4{background:#ffcc00}
#taskbar-items{flex:1;display:flex;align-items:center;height:100%;padding:3px 4px;gap:2px;overflow:hidden}
.taskbar-item{height:26px;padding:0 8px;background:linear-gradient(180deg,#3c7fe3 0%,#245edc 50%,#1941a5 100%);border:1px solid #1941a5;border-radius:2px;color:#fff;font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taskbar-item.active{background:linear-gradient(180deg,#1941a5 0%,#245edc 50%,#3c7fe3 100%);box-shadow:inset 0 0 3px rgba(0,0,0,.3)}
#system-tray{display:flex;align-items:center;gap:6px;padding:0 10px;height:100%;background:linear-gradient(180deg,#1290e3 0%,#1070c0 50%,#0c5ca0 100%);border-left:1px solid #0c3c8a;font-size:11px;color:#fff}
#clock{font-size:11px;color:#fff;min-width:45px;text-align:center}
.tray-icon{font-size:14px;cursor:default}

/* ===== START MENU ===== */
#start-menu{position:fixed;bottom:36px;left:0;width:380px;background:#fff;border:2px solid #3168d5;border-bottom:none;border-radius:8px 8px 0 0;z-index:9500;display:none;box-shadow:3px -3px 10px rgba(0,0,0,.3)}
#start-menu.show{display:block}
.sm-header{background:linear-gradient(180deg,#3168d5,#1941a5);color:#fff;padding:8px 12px;font-size:14px;font-weight:bold;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:8px}
.sm-header .avatar{width:40px;height:40px;background:#f0f0f0;border:2px solid #fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:22px}
.sm-body{display:flex;min-height:300px}
.sm-left{flex:1;background:#fff;padding:6px 0;border-right:1px solid #d6d2c2}
.sm-right{width:160px;background:#d3e5fa;padding:6px 0}
.sm-item{padding:6px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:#000}
.sm-item:hover{background:#3168d5;color:#fff}
.sm-item .si-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sm-sep{border-top:1px solid #d6d2c2;margin:4px 12px}
.sm-item.anomaly{color:#8B0000}
.sm-item.anomaly:hover{background:#8B0000;color:#fff}
.sm-footer{background:linear-gradient(180deg,#3168d5,#1941a5);padding:6px 12px;display:flex;justify-content:flex-end;gap:8px;border-radius:0 0 0 0}
.sm-footer-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:11px;padding:4px 8px;border-radius:2px;display:flex;align-items:center;gap:4px}
.sm-footer-btn:hover{background:rgba(255,255,255,.2)}

/* ===== WINDOWS ===== */
.xp-window{position:absolute;background:#ece9d8;border:2px solid #0054e3;border-radius:8px 8px 0 0;box-shadow:2px 2px 10px rgba(0,0,0,.3);display:flex;flex-direction:column;min-width:200px;min-height:150px;z-index:100}
.xp-window.minimized{display:none!important}
.xp-window.maximized{top:0!important;left:0!important;width:100%!important;height:calc(100% - 36px)!important;border-radius:0}
.win-titlebar{height:28px;background:linear-gradient(180deg,#0054e3 0%,#0532b7 40%,#0054e3 95%,#0532b7 100%);border-radius:6px 6px 0 0;display:flex;align-items:center;padding:0 4px;cursor:move;flex-shrink:0}
.win-titlebar.inactive{background:linear-gradient(180deg,#7a96df 0%,#97b4e7 40%,#7a96df 95%,#97b4e7 100%)}
.win-title{flex:1;color:#fff;font-size:12px;font-weight:bold;padding-left:4px;text-shadow:1px 1px 1px rgba(0,0,0,.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.win-title .wt-icon{font-size:14px}
.win-btns{display:flex;gap:2px}
.win-btn{width:21px;height:21px;border:1px solid rgba(255,255,255,.4);border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:bold;color:#fff;background:linear-gradient(180deg,#3c7fe3,#1941a5)}
.win-btn:hover{background:linear-gradient(180deg,#5c9ff3,#3961c5)}
.win-btn.close-btn{background:linear-gradient(180deg,#e08040,#c04020)}
.win-btn.close-btn:hover{background:linear-gradient(180deg,#f09050,#d05030)}
.win-menubar{background:#ece9d8;border-bottom:1px solid #b5b39d;padding:2px 4px;display:flex;gap:0;flex-shrink:0;font-size:12px}
.win-menubar span{padding:2px 6px;cursor:pointer;color:#000}
.win-menubar span:hover{background:#3168d5;color:#fff}
.win-toolbar{background:#ece9d8;border-bottom:1px solid #b5b39d;padding:4px;display:flex;align-items:center;gap:4px;flex-shrink:0}
.win-addressbar{background:#ece9d8;border-bottom:1px solid #b5b39d;padding:4px;display:flex;align-items:center;gap:4px;flex-shrink:0;font-size:12px}
.win-addressbar label{font-size:11px;color:#000}
.win-addressbar input{flex:1;border:1px solid #7f9db9;padding:2px 4px;font-size:12px;background:#fff;font-family:inherit}
.win-addressbar button{background:#ece9d8;border:1px solid #7f9db9;padding:2px 8px;cursor:pointer;font-size:11px}
.win-content{flex:1;overflow:auto;background:#fff;position:relative}
.win-statusbar{background:#ece9d8;border-top:1px solid #b5b39d;padding:2px 8px;font-size:11px;color:#444;display:flex;align-items:center;gap:10px;flex-shrink:0}
.win-statusbar .sb-section{border-right:1px solid #b5b39d;padding-right:10px}

/* ===== DIALOG ===== */
.xp-dialog{position:fixed;background:#ece9d8;border:2px solid #0054e3;border-radius:8px 8px 0 0;box-shadow:3px 3px 15px rgba(0,0,0,.4);z-index:10000;display:flex;flex-direction:column;min-width:300px}
.dlg-titlebar{height:28px;background:linear-gradient(180deg,#0054e3 0%,#0532b7 100%);border-radius:6px 6px 0 0;display:flex;align-items:center;padding:0 6px}
.dlg-title{flex:1;color:#fff;font-size:12px;font-weight:bold;text-shadow:1px 1px 1px rgba(0,0,0,.4)}

function tryUnlockDiary(){
  var input=document.getElementById('keywordInput');
  var result=document.getElementById('keywordResult');
  if(!input||!result)return;
  var val=input.value.trim();
  if(!val){result.textContent='请输入关键词。';result.style.color='#888';return;}
  var matched=false;
  for(var id in DIARIES){
    var d=DIARIES[id];
    if(d.locked&&d.keyword&&d.keyword===val){
      if(G.foundKeywords.indexOf(val)===-1){
        G.foundKeywords.push(val);
        saveState();
      }
      matched=true;
      result.innerHTML='✅ 关键词 "'+val+'" 已验证。新日记已解锁！';
      result.style.color='#0a0';
      setTimeout(function(){navigateIE('diary')},1500);
      break;
    }
  }
  if(!matched){
    var partialMatch=false;
    for(var id2 in DIARIES){
      var d2=DIARIES[id2];
      if(d2.locked&&d2.keyword&&d2.keyword.indexOf(val)!==-1&&val.length>=2){
        partialMatch=true;
        break;
      }
    }
    if(partialMatch){
      result.textContent='🔮 这个关键词似乎接近某些真相……再想想？';
      result.style.color='#B8860B';

      result.textContent='❌ 没有找到匹配的线索。继续探索归墟小筑吧。';

    }
  }
}

function updateTaskbar(){
  const items=document.getElementById('taskbar-items');
  items.innerHTML='';
  windows.forEach(w=>{
    const el=document.getElementById(w.id);
    const isMin=el?el.classList.contains('minimized'):true;
    const isActive=activeWindowId===w.id&&!isMin;
    const d=document.createElement('div');
    d.className='taskbar-item'+(isActive?' active':'');
    d.innerHTML=`<span style="font-size:12px">${w.icon}</span><span style="overflow:hidden;text-overflow:ellipsis">${w.title}</span>`;
    d.onclick=()=>{
      if(isMin)restoreWindow(w.id);
      else if(isActive)minimizeWindow(w.id);
      else focusWindow(w.id);
    };
    items.appendChild(d);
  });
}

let dragState=null;
function startDrag(e,id){
  const el=document.getElementById(id);
  if(!el||el.classList.contains('maximized'))return;
  focusWindow(id);
  dragState={id,startX:e.clientX,startY:e.clientY,origX:el.offsetLeft,origY:el.offsetTop};
  e.preventDefault();
}
document.addEventListener('mousemove',e=>{
  if(!dragState)return;
  const el=document.getElementById(dragState.id);
  if(!el)return;
  el.style.left=(dragState.origX+e.clientX-dragState.startX)+'px';
  el.style.top=Math.max(0,dragState.origY+e.clientY-dragState.startY)+'px';
});
document.addEventListener('mouseup',()=>{dragState=null});

const DIARIES={"d1997_return": {"date": "1997年6月15日", "weather": "晴转多云", "title": "回乡记", "preview": "毕业回来了。坐了一天的大巴，骨头都要散了……", "locked": false, "content": ["毕业回来了。", "坐了一天的大巴，骨头都要散了。从省城到鹤城，先是高速，然后国道，最后是山路。大巴在盘山路上晃来晃去，旁边的女生吐了三次。我倒还好，就是有点晕。", "但看到鹤城的山，心就安了。那些山还是老样子，青青的，绵绵的，像一条条卧龙。小时候觉得它们很大，现在觉得它们很旧。但\"旧\"不是坏事。旧的东西有味道。", "路过一个干涸的大坑。司机说那是古代的天坑，下面原来有水的，后来不知道什么时候干了。我往坑里看了一眼，很深，看不到底。坑壁上长满了青苔，有一块地方颜色不一样，像是被凿过的。", "我没多想。可能是因为太累了。", "到家了。爸爸在门口等我。他瘦了一些，但精神还好。妈妈说了一大堆话，我一句也没记住，光顾着吃她做的酸汤鱼了。", "晚上在院子里乘凉。天上的星星真多啊，多到不真实。在城市里待了三年，差点忘了星星可以密到这种程度。", "我回来了。"]}, "d1997_house": {"date": "1997年6月20日", "weather": "阴", "title": "老宅", "preview": "打扫了爸爸的老宅。在书房发现好多旧书，有一本没有书名……", "locked": false, "content": ["今天打扫了爸爸的老宅。", "说是老宅，其实就是三间青砖瓦房，院子里有一棵老柚子树。树龄至少有七八十年了，每年结的柚子又酸又大，没人吃，掉在地上烂掉。妈妈说这棵树\"有灵性\"，不让砍。", "书房是最乱的。爸爸的书太多了，堆得到处都是。大多是线装的古书，我翻了翻，很多字不认识。还有一些关于鹤城地方志的书，纸页发黄，闻起来有一股旧时光的味道。", {"type": "hidden", "require": 3, "text": "[守真在这里停顿了很久。你能感觉到她在犹豫要不要写下去。]"}, "有一本书很奇怪。没有书名，封面是牛皮纸的，上面画着一些奇怪的符号。不是汉字，不像任何我认识的文字。翻开来看，里面的页面几乎全是空白，只在最后几页有一些手绘的图——山谷、裂缝、还有像门一样的东西。", "我拿去问爸爸。他看了一眼，脸色变了。一把从我手里夺过去，说\"这不是你该看的东西\"，然后锁进了柜子里。", "我从来没见过爸爸那样。他平时是很温和的人。但那一下，他的手在抖。", "算了，也许是本旧族谱什么的吧。"]}, "d1997_internet": {"date": "1997年7月3日", "weather": "大雨", "title": "拨号上网", "preview": "第一次成功联网了！！激动得哭了！！", "locked": false, "content": ["第一次成功联网了！！激动得哭了！！", "搞了整整两个星期。先要装调制解调器（爸爸帮我从县城带回来的），然后装电话线（等了半个月），然后开通拨号上网（花了好几百块，心疼死了）。", "今天凌晨三点，我拨了第四十七次号。嘟——嘟——嘟——滋滋滋——", "通了！！", "屏幕上出现了一行字：\"Welcome to Internet\"。我盯着那行字看了整整五分钟，然后哭了。不是难过，是激动。", "世界原来这么大。而我，在这个小山村里面，第一次触到了它。", "拨号的声音真的很好听。滋滋嘟嘟的，像外星人在唱歌。虽然每次上网电话费都在跑，但我觉得值。", "我要用这个网站记录一切。"]}, "d1997_website": {"date": "1997年7月15日", "weather": "晴", "title": "建站第一天", "preview": "用FrontPage做了第一个网页！虽然很丑但是好开心！", "locked": false, "content": ["用FrontPage做了第一个网页！虽然很丑但是好开心！", "参考了好多别的个人主页。有的做得好漂亮，有动画、有背景音乐、有计数器。我目前还不会那些，但我会慢慢学的。", "首页做了最简单的布局：自我介绍、日记本、友情链接。背景色选了深蓝色——因为我喜欢夜空的颜色。", "<!-- 如果你在看这段代码的话，我在HTML注释里藏了一个小秘密。把每篇日记标题的第一个字连起来读。这只是第一个。 -->", "给自己取了一个口号：\"心之所向，素履以往。\"虽然我还不太确定我心之所向是什么。但我觉得，写下来就会慢慢清楚。", "今天上传了第一张照片——院子里的柚子树。上传了半个小时。拨号太慢了。但是看到照片出现在网页上的那一刻，我觉得一切都值了。", "你好啊，互联网。我是陈守真，来自鹤城归墟村。"]}, "d1997_summer": {"date": "1997年8月12日", "weather": "闷热", "title": "夏夜", "preview": "院子里乘凉写了一首诗。蝉声好大。", "locked": false, "content": ["院子里乘凉写了一首诗。蝉声好大。", "今晚特别热，屋里待不住，搬了竹床到院子里。妈妈点了蚊香，爸爸泡了凉茶。星星还是那么多，那么多，看得人发呆。", "写了一首诗：", "「蝉声如织夜如纱，萤火三两点人家。独坐院中数星子，祠前老树又开花。」", "写完念给妈妈听。她说\"写得好\"，但她其实听不懂我在写什么。爸爸在旁边听到了，没说话，只是看了一眼祠堂的方向。", "祠堂就在院子下方几十米的地方。晚上看过去，黑黢黢的一团。爸爸说那里面供着陈家的列祖列宗。每年冬至他都要进去\"做事\"，不让人跟。", "我问他做什么事。他说\"祭祖\"。", "但祭祖为什么不让别人看呢？", "算了，也许是陈家的规矩吧。每个家族都有自己的规矩。"]}, "d1997_ghost": {"date": "1997年8月16日", "weather": "阴转小雨", "title": "中元节", "preview": "记录鹤城中元节的习俗。有一件事很奇怪……", "locked": false, "content": ["记录鹤城中元节的习俗。", "今天是农历七月十五，中元节。鹤城这边的规矩很隆重。", "白天要去坟上烧纸。晚上在路口烧纸钱，给\"那边的人\"用。妈妈会准备很多纸元宝，一边折一边念叨：\"拿好了，够花就行，不要回来找。\"", "但有一件事很奇怪。", "傍晚的时候，我看到村头的王奶奶在烧纸。但她烧的不是给已故亲人的——她在烧给一个\"不存在的人\"。", "我問她在烧给谁。她说：\"给一个以前住在这里的人。\"我问是谁。她说：\"不记得了。但是每年都要烧。\"", "\"不记得了但每年都要烧\"——这句话好矛盾啊。但王奶奶的表情很认真，不像在开玩笑。", "后来我问爸爸。爸爸说：\"别问了。有些事情，忘了比记着好。\"", "这是什么意思呢？", "还有一件事：今晚烧纸的时候，我数了一下人数。我们一圈有八个人在烧纸，但地上的影子……好像有九个。", "也许是我数错了吧。灯光太暗了。"]}, "d1997_shrine": {"date": "1997年9月1日", "weather": "晴", "title": "祠堂", "preview": "第一次正式参观陈家祠堂。拍了照片。", "locked": false, "content": ["第一次正式参观陈家祠堂。拍了照片。", "爸爸今天心情好，说可以让我进去看看。", "祠堂比我想象的大。外面看着不大，但进去之后发现有三进。第一进是正厅，供着牌位。第二进是一个小天井，有一口井——不是水井，是\"天井\"，用来采光的。第三进……爸爸没让我进去。", "第三进的门上挂着锁。爸爸说是放祭器的地方，不常开。", "我拍了几张照片。用的是一台海鸥牌相机，爸爸年轻时候买的。胶卷很贵，一张都不能浪费。", "正厅的牌位最高处写的是\"陈氏始祖讳永昌之位\"。爸爸说他也不知道永昌公是什么时候的人，只知道是明朝的。", "天井里有一棵桂花树，还没到花期，但叶子很茂盛。树下有一块石板，石板上刻着一些字，被苔藓盖住了大半。我清理了一下，隐约能看到：\"……门常在……守勿……绝……\"后面的看不清了。", "爸爸催我出来了。", "回去看照片，发现一张照片上，正厅角落好像有一个影子。但我记得当时那里什么都没有。", "应该是相机的问题吧。老相机了。"]}, "d1998_spring": {"date": "1998年2月4日", "weather": "阴冷", "title": "开春", "preview": "新年新气象。有三个邻居搬走了，也不知道搬去哪……", "locked": true, "keyword": "搬迁", "content": ["新年新气象。", "但开春以来心情一直不太好。村里出了些事。", "有三个邻居搬走了——村东头的李伯、巷子里的张婶、还有卖豆腐的老周。说是搬走了，但没看到他们收拾东西，也没看到有车来接。就是……突然就不在了。", "他们的房子空了。门开着，里面的东西还在。我去张婶家看了一眼，灶台上还有半碗冷粥。", "我问爸爸他们搬去哪了。爸爸说\"搬去城里了\"。但我问其他村民，他们都说不知道。", "更奇怪的是——我问隔壁的刘婶\"张婶搬去哪了你知道吗\"，刘婶说：\"什么张婶？这里没有姓张的啊。\"", "可是上个月她还跟我说\"张婶的豆腐做得越来越好了\"啊！", "是我的记忆出问题了吗？", "还是……有什么我不理解的事情在发生？"]}, "d1998_repair": {"date": "1998年3月15日", "weather": "多云", "title": "修缮", "preview": "父亲请人在修缮祠堂。修了整整一个月。", "locked": true, "keyword": "嗡鸣", "content": ["父亲请人在修缮祠堂。", "修缮了整整一个月。不让任何人靠近。", "来帮忙的人我也认识几个——李伯（已经搬走的那个）、老周（也是）、还有几个外村的壮劳力。他们每天搬石头进祠堂，有时候到天亮才出来。", "我问爸爸修什么。他说\"补墙\"。", "补墙需要搬那么多石头吗？", "修缮期间，每天夜里我都能听到祠堂方向传来声音。不是施工的声音——更像是一种……嗡鸣。低沉的、持续的、像是从地底下传来的。", "我问妈妈听到了没有。她说没有。", "也许是风声吧。这个季节山里风大。", {"type": "horror", "text": "但风不会嗡鸣。风不会让你从梦中醒来，心跳得很快，却不知道为什么。"}]}, "d1998_dream": {"date": "1998年4月2日", "weather": "雨", "title": "怪梦", "preview": "做了一个噩梦。梦见水下有人敲门。", "locked": true, "keyword": "水下", "content": ["做了一个噩梦。", "梦里我在水下。不是在海里，是在一个很大的、很深的地方。水是黑的，但不是脏——是那种深到没有光的黑。", "我能呼吸。这不正常，但在梦里，一切都很自然。", "然后我听到了敲门声。", "咚。咚。咚。", "很有节奏。像是有人在水的另一边敲门。", "我往声音的方向游。游了很久。然后我看到了一面墙。墙很厚，上面刻满了字。那些字——和爸爸那本无字书上看到的符号一模一样。", "墙的另一边有人在敲。", "我贴上去听。听到一个声音，很远很远的声音，说的是：", "\"开门。\"", "我醒了。浑身是汗。", "窗外的雨还在下。我听到院子里有水声——不是雨声，是井水的声音。我们院子里没有井。", "不对，我们有。但那口井已经干了好几年了。", "可是今晚，我听到了水声。"]}, "d1998_notice": {"date": "1998年5月10日", "weather": "晴", "title": "搬迁通知", "preview": "村里贴了通知，说修水库要搬迁。父亲看完摔了碗。", "locked": true, "keyword": "水库", "content": ["村里贴了通知，说修水库要搬迁。", "是县里发的文件。说要在归墟村上游修建一座水库，整个村子都在淹没范围内。要求两年内完成搬迁。", "村民大会开了整整一天。大多数人都同意——说实话，这个村子确实太偏了。年轻人都想走，去城里打工，去更好的地方生活。", "但爸爸激烈反对。", "他站起来的时候，手在抖。他说了一句很奇怪的话：", "\"你们不知道下面压着什么。\"", "没人理解他在说什么。大家都以为他是不舍得老宅。", "散会后我问他到底怎么了。他沉默了很久，说：\"这个村子不能淹。祠堂不能淹。你明白吗？\"", "我不明白。但他看我的眼神——那是一种恐惧。", "我这辈子第一次在爸爸眼里看到恐惧。"]}, "d1998_missing1": {"date": "1998年9月8日", "weather": "阴", "title": "失踪者·壹", "preview": "张婶不见了。我问其他村民，所有人都说\"张婶是谁？\"", "locked": true, "keyword": "张婶", "content": ["张婶不见了。", "就是那个之前\"搬走\"的张婶——不对，在其他人记忆里，她好像从来没存在过。但我是记得的。我确定我记忆中没有出错。", "上个月我还看到她在家门口晒萝卜干。我跟她打了招呼，她说\"守真啊，你瘦了\"。", "然后这个月初，她就不在了。", "不只是人不在——她的房子被清空了。不是搬走那种清空，是像是从来没有人住过。门槛上的磨损痕迹都没了。灶台是干净的。", "我去问刘婶。刘婶说：\"什么张婶？这附近没有姓张的人家啊。\"", "但上个月！就上个月！她还跟我说\"张婶的豆腐做得越来越好了\"！——等等，那是老周，不是张婶。", "我的记忆在混乱。", "但我确定一件事：张婶存在过。她存在过。", {"type": "horror", "text": "可是，如果全世界都说她不存在——那她到底存在过吗？"}]}, "d1998_missing2": {"date": "1998年10月15日", "weather": "大雾", "title": "失踪者·贰", "preview": "老周也不见了。这次连他的妻子都说\"我一直一个人住\"。", "locked": true, "keyword": "不存在", "content": ["老周也不见了。", "卖豆腐的老周。每天早上五点起来磨豆子，六点挑着担子穿村叫卖。他的豆腐是鹤城最好吃的——嫩得像云朵。", "他也\"不存在\"了。", "这一次更恐怖。我去问老周的妻子——他明明有妻子的！一个很和善的阿姨，每次我去买豆腐都会多给我一块。", "她开门，看着我，说：\"你找谁？我一直一个人住啊。\"", "她不像在说谎。她的表情是真诚的困惑。", "我站在那门口，突然觉得非常冷。不是天气的冷——是一种从骨头里渗出来的冷。", "我开始害怕了。不是害怕失踪本身，而是害怕——害怕有一天，我也变成了\"不存在的人\"。", {"type": "horror", "text": "我跑回家，把门关上。然后我打开网站，把这些写下来。如果有一天这些文字还在，而我已经不在了——请知道，我来过。我在这里。我叫陈守真。"}]}, "d1998_fear": {"date": "1998年11月1日", "weather": "阴冷", "title": "恐惧", "preview": "开始害怕了。发现网站上多了一些我没写过的内容……", "locked": true, "keyword": "乱码", "content": ["开始害怕了。", "今天打开网站后台，发现多了一些我从来没写过的内容。", "是几行乱码一样的文字。不是中文，不是英文，不是我见过的任何文字。但是——", "但是那些字和我在爸爸那本无字书上看到的符号，是一样的。", "我试过删除那些内容。删不掉。刷新之后还在。", "我问了网友\"夜行者\"。他是做技术的。他说可能是网站被黑客入侵了。但他检查了我给他的网页代码，说没有发现入侵痕迹。", "他说了一句让我不安的话：\"这些代码……看起来不像是被人加进去的。像是自己长出来的。\"", "代码不会自己生长。", "但这个网站——", "这个网站好像在变。", "不是变坏，也不是变好。是在……变成别的东西。"]}, "d1998_investigate": {"date": "1998年11月20日", "weather": "晴冷", "title": "调查", "preview": "去县图书馆查资料。查到了\"归墟\"的古籍记载……", "locked": true, "keyword": "列子", "content": ["去县图书馆查资料。", "我查了\"归墟\"这个词。", "《列子·汤问》里说，归墟是渤海之东的一个无底深渊，所有的水都往那里流，但永远填不满。", "但这只是神话。我要找的不是神话。", "我在县志里找到了一段记载——很短，只有一行：\"鹤城西三十里有归墟谷，深不可测，土人畏之。明洪武间陈氏筑祠其上，不知所祀何神。\"", "不知所祀何神。", "祠堂不是祭祖的吗？为什么县志说\"不知所祀何神\"？", "我又找关于归墟村的历史。但关键的几页——被撕掉了。", "管理员说：\"那几页老早就没了。可能是以前被虫蛀了，清理的时候扔掉的。\"", "虫蛀？偏偏是关键的几页被虫蛀了？", "我在图书馆坐到天黑。出来的时候，天上有一轮月亮。", "月亮有点红。"]}, "d1998_basement": {"date": "1998年12月5日", "weather": "阴", "title": "地下室", "preview": "趁父亲不在，潜入了祠堂地下室。我发现了——", "locked": true, "keyword": "天井", "content": ["趁父亲不在，潜入了祠堂地下室。", "我等了一个星期。爸爸去县城办事，要两天才回来。", "我用他钥匙串上备用钥匙（我偷偷配的，别告诉他）打开了祠堂后门的锁。", "地下室入口在天井的井底——那口\"天井\"不是普通的天井。井壁上有石阶，螺旋向下。我打着手电筒往下走。", "走了大约十米，到了底部。", "这里有一间房。不大，四面是石墙。", "然后我看到了那面墙。", "不是普通的墙。它是新砌的——和祠堂其他部分明显不同。石头更白，缝隙更整齐。这不是明朝的建筑，这是最近才加上去的。", "墙上刻满了字。", "那些字——我在爸爸的无字书上见过。在我网站的乱码里见过。在古井的井壁上见过。", "它们是同一种文字。", "我不知道这是什么语言。但那些字在动。不是错觉——它们在微微地蠕动，像是活的。", {"type": "horror", "text": "我把手贴上去。墙面是温的。不应该是温的——这是地下室。"}]}, "d1998_mirror": {"date": "1998年12月10日", "weather": "阴", "title": "墙后", "preview": "我在墙后面发现了一面镜子。但镜中映出的不是我……", "locked": true, "keyword": "镜子", "content": ["我在墙后面发现了一面镜子。", "不对，不是\"发现\"。是墙后面本来就有一面镜子——不，那面\"墙\"本身就是镜子。", "那面新砌的墙——我从侧面看，发现它不是一面完整的墙。中间有一道缝。我挤了进去。", "墙的另一边是一个更小的空间。几乎只够一个人站着。", "正对面——是一面镜子。", "不，不是镜子。看起来像镜子，但映出的不是我。", "镜子里面站着一个人。不是我的倒影。是一个我不认识的人。他穿着古代的衣服，看着我。他的嘴在动，但我听不到声音。", "我后退了一步。他也后退了一步——但动作比我慢了半拍。", "然后我注意到了他的手。他的手按在镜面上，从里面。", "他想出来。", {"type": "horror", "text": "我跑出了地下室。跑回家。锁上门。但我知道——那面镜子还在。那个人还在。他在等。"}]}, "d1998_confront": {"date": "1998年12月20日", "weather": "雪", "title": "对峙", "preview": "和父亲摊牌了。他承认了一切。", "locked": true, "keyword": "门", "content": ["和父亲摊牌了。", "我把我知道的全部摆出来了。地下室。那面墙。镜子。失踪的人。", "爸爸听完后，沉默了很久。", "然后他说了四个字：\"你知道了。\"", "不是\"你怎么知道的\"。是\"你知道了\"。", "好像他一直在等这一刻。", "他承认了一切。", "三个人——李伯、张婶、老周——他们没有\"消失\"。他们的\"存在\"被用来加固封印。那面墙后面的镜子，就是封印的核心。", "\"封印在衰弱。\"他说。\"水库一旦蓄水，整个村子被淹，祠堂也会被淹。封印会彻底崩溃。\"", "\"那三个人——是你在……\"", "\"我没有杀他们。\"他打断我。\"我用了他们的'存在感'。他们还活着——在某个地方。只是没有人记得他们了。包括他们的家人。\"", "\"这不就是——\"", "\"这是陈家的命。\"他说。\"从明朝开始。每一代守祠人都在做这件事。现在轮到我了。但我不行了。我老了。\"", "他看着我。", "\"守真。\"他第一次用这种语气叫我的名字。\"如果有一天你做了选择——记住，门有两面。\""]}, "d1998_newyear": {"date": "1998年12月31日", "weather": "雪转晴", "title": "除夕", "preview": "最后一个平静的除夕。父亲给我盛了一碗饭。", "locked": true, "keyword": "星星", "content": ["最后一个平静的除夕。", "爸爸给我盛了一碗饭。满满的一碗，压得实实的。", "\"多吃点。\"他说。\"以后的路长。\"", "妈妈炒了几个菜。酸汤鱼、腊肉、炒青菜。我们三个人围着桌子坐着。外面有零星的鞭炮声。", "爸爸喝了酒。他平时不喝酒的。今天喝了很多。", "他喝醉之后说了一句话，我不确定他是不是在对我说：", "\"守真，对不起。\"", "然后他就睡着了。", "我把他的被子盖好。坐在院子里看星星。", "星星还是那么多。那么多，那么多。", "我不知道明年还能不能看到这些星星。", "但我希望——不管发生了什么——这个网站还在。", "如果有一个人，在很多年以后，打开这个网站，读到这些文字——", "请知道，陈守真在这里活过。"]}, "d1999_decide": {"date": "1999年1月15日", "weather": "阴", "title": "决意", "preview": "我决定把一切记录下来。如果有人看到这些……", "locked": true, "keyword": "记忆", "content": ["我决定把一切记录下来。", "从1997年到今天。所有的日记。所有的照片。所有的发现。", "我把它藏在了网站的代码里。藏在HTML注释里，藏在CSS里，藏在那些看起来像乱码的字符里。", "如果有一天有人能看到这些——如果你正在读这些文字——", "请帮帮我。", "不是救我。我已经做了我的选择。", "但请你记住——归墟村存在过。这些人存在过。我存在过。", "不要让他们变成\"不存在的人\"。", "记忆是最好的封印。", "只要有人记得，就不会真正消失。", {"type": "horror", "text": "我不知道我还有多少时间。月亮越来越红了。地下室的方向，每天夜里都能听到声音。不是敲门声了——是很多人在一起说话的声音。他们在念什么。"}]}, "d1999_moon": {"date": "1999年2月14日", "weather": "晴", "title": "今晚月亮好红", "preview": "它要过来了。", "locked": true, "keyword": "月亮", "content": [{"type": "horror", "text": "它要过来了。"}]}};

function highlightClues(html){
  var clues=['门有两面','门常在','不存在','搬迁','嗡鸣','水下','水库','张婶','乱码','列子','天井','镜子','星星','记忆','月亮'];
  var found=G.foundKeywords||[];
  return html.replace(/>([^<]+)</g,function(m,text){
    var r=text;
    clues.forEach(function(kw){
      if(r.indexOf(kw)!==-1){
        var cls=found.indexOf(kw)!==-1?'clue':'clue clue-undiscovered';
        r=r.split(kw).join('<span class="'+cls+'" title="🔑 线索">'+kw+'</span>');
      }
    });
    return '>'+r+'<';
  });
}
function renderIEPage(pid){
  const fn=iePages[pid]||iePages['home'];
  return highlightClues('<div class="ie-page'+(G.horrorLevel>=2?' dark-mode':'')+'" id="ie-content-area">'+fn()+'</div>');
}

function showDiaryInNotepad(id){
  const d=DIARIES[id];if(!d)return;
  let text=d.date+' '+d.weather+'\n'+'《'+d.title+'》\n\n';
  d.content.forEach(p=>{
    if(typeof p==='string')text+=p+'\n\n';
    else if(p.type==='horror')text+=p.text+'\n\n';
    else if(p.type==='hidden'&&G.knowledge>=p.require)text+=p.text+'\n\n';
  });
  // Find or create notepad
  let npWin=windows.find(w=>w.title.includes('守真的日记'));
  if(!npWin){
    createWindow({title:'守真的日记 - 记事本',type:'notepad',icon:'📝',width:500,height:380,x:140,y:80,content:'<textarea class="notepad-content" readonly>'+text.replace(/</g,'&lt;')+'</textarea>'});

    if(el)el.innerHTML='<textarea class="notepad-content" readonly>'+text.replace(/</g,'&lt;')+'</textarea>';
    restoreWindow(npWin.id);
  }
}

// CULTURE
iePages['culture']=function(){
  if(!G.mainRoute)detectRoute('empathy');
  let h='<span class="back-btn" onclick="navigateIE(\'home\')">← 返回首页</span><div class="retro-border"><h2 style="color:#B8860B;text-align:center;margin-bottom:8px">🏮 鹤城风物</h2><p style="text-align:center;font-size:11px;color:#888">记录我家乡的故事和传说</p></div>';
  h+='<div class="folklore-section"><h3>归墟传说</h3><p class="folklore-text">《列子·汤问》载："渤海之东，不知几亿万里，有大壑焉，实惟无底之谷，其下无底，名曰归墟。"</p><p class="folklore-text">但在我们鹤城，老人们讲的归墟不是东海。他们说，归墟就在鹤城西山的深谷里。很久很久以前，那里有一道裂缝，裂缝通往另一个世界。</p><p class="folklore-text">那个世界里住着"曾经存在过的人"。他们不是鬼，是被遗忘的人——世界上再也没有人记得他们，他们就落进了归墟。</p><p class="folklore-text">老一辈人说，归墟村曾经有过三次大搬迁。每一次搬迁之后，都会有一些人"消失"——不是搬走了，是被遗忘了。所以村里的老人们很忌讳"搬迁"这两个字。</p><p class="folklore-warning">※ 以下内容来自村中老人口述，仅供参考 ※</p></div>';
  h+='<div class="folklore-section"><h3>守祠人传说</h3><p class="folklore-text">明朝洪武年间，陈氏先祖在此建村。据说他发现了那道裂缝，并在裂缝上方建了一座祠堂。祠堂不是用来祭祖的——是用来"看门"的。</p><p class="folklore-text">每一代陈氏族长都要继承"守祠人"的身份。他们要在每年冬至独自进入祠堂地下室，进行一种叫做"安门"的仪式。具体内容没人知道。但"安门"这个词本身就很有意思——不是"守门"，不是"关门"，是"安门"。好像那扇门需要被安抚一样。</p><p class="folklore-text">村里人说："陈家的人守的不是祠堂，是门。门关着，我们就安全。门开了，什么都完了。"</p><p class="folklore-text">据说夜深人静时，祠堂方向会传来低沉的嗡鸣声。老人们说那是"门在响"——门关得太久了，铰链受不了。但守祠人说，那不是铰链的声音，是另一边有什么东西在共振。</p></div>';
  h+='<div class="folklore-section"><h3>水鬼新娘</h3><p class="folklore-text">鹤城的水库下面淹没了大片土地。老人们说，水库下面淹掉的不只是田地——还有整个归墟村最古老的部分。被水淹没的土地上的亡者，会变成"水鬼新娘"。她们不是要找替身，而是要找一个"记得她们名字的人"。</p><p class="folklore-text">如果你在雨夜听到水边有女子唱歌，千万不要回头。但如果她唱的是你认识的曲调——那说明她曾经是你的亲人。</p></div>';
  h+='<div class="folklore-section"><h3>红月谶语</h3><p class="folklore-text">鹤城有一首童谣，老人们说是"不可以念的"：</p><p style="text-align:center;color:#8B0000;font-size:15px;margin:12px 0;line-height:2.5;font-style:italic">红月出，门扉开，<br>守者死，墟中人来。<br>水没田，土没碑，<br>忘者归，忆者陪。</p><p class="folklore-text">我问过父亲这首童谣是什么意思。他沉默了很久，说："别念。念了就会记住。记住了就会被记住。"</p></div>';
  h+='<div class="folklore-section"><h3>安魂仪式（已停止）</h3><p class="folklore-text">归墟村曾有一种独特的安魂仪式。当有人去世后，全村人要在灵堂前站成一圈，每人手持一支未点燃的香。由守祠人念诵一段无人能听懂的文字——据说那不是任何人间语言。</p><p class="folklore-text">念完之后，所有人同时点燃香。据说那一刻，你能看到逝者的灵魂从身体里升起来，像烟一样飘向祠堂的方向。</p><p class="folklore-text" style="color:#8B0000">以下仪式已于1998年停止执行。<br>原因：执行人拒绝继续。</p><p class="folklore-text" style="color:#666;font-size:11px">※ 查看本站的HTML源代码，你可能会发现更多秘密。有些真相藏在乱码之中。</p></div>';
  if(G.foundKeywords.indexOf('搬迁')===-1)h+='<p style="font-size:10px;color:#666;margin-top:10px;font-style:italic">📝 你隐约觉得这段关于搬迁的记述里藏着什么重要的词……</p>';
  h+=renderSourceHint();
  if(G.subRoute==='escaper'&&!G.cpReached.cp3)h+=renderCP3();
  return h;
};

iePages['about']=function(){
  if(!G.mainRoute)detectRoute('empathy');
  return '<span class="back-btn" onclick="navigateIE(\'home\')">← 返回首页</span><div class="retro-border"><h2 style="color:#B8860B;text-align:center;margin-bottom:12px">👤 关于我</h2></div><div class="about-section retro-border"><div class="profile-photo">[照片已损坏]<br><span style="font-size:9px">1998年春 摄于老宅院中</span></div><h3>基本资料</h3><p>姓名：陈守真<br>生于：1973年<br>家乡：鹤城郊区·归墟村<br>学历：鹤城师范学校毕业（1997年）<br>爱好：写诗、摄影、上网、读旧书</p><h3>自我介绍</h3><p style="text-indent:2em">你好呀，欢迎来到我的小站。</p><p style="text-indent:2em">我叫陈守真，是归墟村土生土长的姑娘。师范毕业后本来可以留在城里教书，但我还是回来了。这里虽然小，但是安静，适合写东西。</p><p style="text-indent:2em">去年学会了上网，激动得不得了。以前觉得世界就是一个村子那么大，现在才发现互联网上有那么多有趣的人。</p><p style="text-indent:2em">建了这个小站，就是想记录一下日常生活，写写诗，拍拍照片。如果恰好有朋友路过，留个言，那就是缘分了。</p><p style="text-indent:2em;color:#888;font-size:11px;margin-top:12px">口头禅："这世界比我想象的大，也比我想象的怪。"</p><p style="text-indent:2em;color:#777;font-size:11px;margin-top:8px;font-style:italic">我相信记忆的力量。只要有人记得，就不会真正消失。记忆是最好的封印。</p><p style="font-size:10px;color:#666;margin-top:8px;font-style:italic">📝 这段话里好像藏着一个很重要的词……关于"记忆"。</p><h3>联系方式</h3><p>Email：guixu_xiaozhu@163.com<br>OICQ：暂不开通（拨号太贵了T_T）<br>BBS：鹤城信息港·文学版</p>'+(G.horrorLevel>=2?'<div style="margin-top:15px;color:#8B0000;font-size:11px;text-align:center;border-top:1px dashed #8B0000;padding-top:8px">如果你在读这些文字……<br>请记住我的名字。<br>请记住我在这里存在过。<br><span style="font-size:10px">这是唯一的要求。</span></div>':'')+(G.horrorLevel>=3&&!G.cpReached.cp2?'<div style="margin-top:10px;color:#666;font-size:10px;text-align:center;font-style:italic;border-top:1px dotted #666;padding-top:6px">有些人的"不存在"比"存在"更让人害怕。<br>当你发现一个人不存在的时候——她去了哪里？</div>':'')+'</div>'+renderSourceHint();
};

// POETRY
iePages['poetry']=function(){
  return '<span class="back-btn" onclick="navigateIE(\'home\')">← 返回首页</span><div class="retro-border"><h2 style="color:#B8860B;text-align:center;margin-bottom:12px">✒️ 归墟诗社</h2></div><div class="poem-block"><div class="poem-title">《夏夜》</div><div class="poem-text">蝉声如织夜如纱，<br>萤火三两点人家。<br>独坐院中数星子，<br>祠前老树又开花。</div></div><div class="poem-block"><div class="poem-title">《井》</div><div class="poem-text">古井深无底，<br>照见人不在。<br>问水水不语，<br>问月月沉海。</div><p style="font-size:10px;color:#888;margin-top:6px">1997年8月 作于老宅</p></div><div class="poem-block" style="border-color:rgba(139,0,0,.3)"><div class="poem-title" style="color:#8B0000">《深渊》</div><div class="poem-text" style="color:#666">水下的世界没有声音，<br>水下的石头不长苔。<br>水下有人睁着眼，<br>等我下去陪。</div><p style="font-size:10px;color:#888;margin-top:6px">1998年春 深夜偶得 [未发表]</p></div><div class="poem-block"><div class="poem-title">《无题》</div><div class="poem-text">有人问我何处去，<br>我说归墟水连天。<br>门前旧路生青苔，<br>梦里新识已忘言。</div><p style="font-size:10px;color:#888;margin-top:6px">1998年秋</p></div>'+(G.horrorLevel>=2?'<div class="poem-block" style="border-color:#8B0000"><div class="poem-title" style="color:#8B0000">《红月》</div><div class="poem-text" style="color:#cc4444">月非月，门非门，<br>墙后之人不是人。<br>汝非汝，我不我，<br>归墟深处等归魂。</div><p style="font-size:10px;color:#666;margin-top:6px">1999年2月14日 [最后之作]</p></div>':'')+(G.foundKeywords.indexOf('月亮')===-1?'<p style="font-size:10px;color:#666;font-style:italic;margin-top:8px;text-align:center">📝 月亮……为什么这些诗里总是在写月亮？</p>':'')+'<div class="poem-block"><div class="poem-title">《古诗收藏·鹤城竹枝词》</div><div class="poem-text" style="font-size:11px">清代鹤城文人佚名所作：<br><br>西山有谷谷有泉，<br>泉落深壑不生烟。<br>土人代代传异事，<br>夜半有人语墓前。</div></div>'+(G.foundKeywords.indexOf('水下')===-1?'<p style="font-size:10px;color:#666;margin-top:10px;font-style:italic">📝 那首《深渊》读起来有些不安……水下到底有什么？</p>':'')+renderSourceHint();
};

// ===== FAKE SHUTDOWN =====
function fakeShutdown(){
  document.getElementById('start-menu').classList.remove('show');
  if(G.ending==='guardian'){
    // Trigger loop ending after guardian
    G.ending='loop';
    navigateIE('ending');
    return;
  }
  // Show shutdown screen then BSOD or ending
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:16px;transition:opacity 2s';
  overlay.innerHTML='<div style="text-align:center"><p>正在关闭计算机…</p><p style="font-size:12px;color:#888;margin-top:10px">正在保存设置…</p></div>';
  document.body.appendChild(overlay);
  setTimeout(()=>{
    overlay.innerHTML='<div style="text-align:center"><p style="color:#8B0000">错误：无法正常关机。</p><p style="font-size:12px;color:#888;margin-top:10px">归墟进程仍在运行。</p><p style="font-size:11px;color:#666;margin-top:20px">按任意键返回桌面…</p></div>';
    const handler=()=>{overlay.remove();document.removeEventListener('keydown',handler);document.removeEventListener('click',handler)};
    setTimeout(()=>{document.addEventListener('keydown',handler);document.addEventListener('click',handler)},1500);
  },3000);
}

function triggerFourthWall(){
  var existing=document.querySelector('.psych-fourth-wall');if(existing)existing.remove();
  var msgs=['\u4f60\u7684\u7a97\u53e3\u53eb '+['MM','DESKTOP','PC'][Math.floor(Math.random()*3)]+'-'+Math.floor(1000+Math.random()*9000),'\u4f60\u5df2\u7ecf\u5728\u8fd9\u91cc\u5f88\u4e45\u4e86','\u4f60\u7684\u540d\u5b57\u5df2\u7ecf\u51fa\u73b0\u5728\u540d\u5355\u4e0a\u4e86','\u6b22\u8fce\u56de\u6765','\u4f60\u4ee5\u4e3a\u4f60\u5728\u73a9\u6e38\u620f\u5417','\u95e8\u5728\u4f60\u8eab\u540e','\u522b\u5173\u6389\u5c4f\u5e55'];
  var el=document.createElement('div');el.className='psych-fourth-wall';
  el.textContent=msgs[Math.floor(Math.random()*msgs.length)];
  document.body.appendChild(el);
  setTimeout(function(){el.style.transition='opacity 3s';el.style.opacity='0';setTimeout(function(){el.remove()},3000)},5000);
}
